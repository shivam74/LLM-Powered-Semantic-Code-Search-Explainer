version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: llm_search_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Map the chroma db data
      - chroma_data:/app/chroma_data
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: llm_search_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend

  mongodb:
    image: mongo:latest
    container_name: llm_search_mongodb
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
  chroma_data:
