
services:
  backend:
    build:
      context: ./backend
    container_name: llm_search_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_data
    environment:
      # Core
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # LLM providers
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Hybrid retrieval tuning
      - VECTOR_WEIGHT=${VECTOR_WEIGHT:-0.7}
      - BM25_WEIGHT=${BM25_WEIGHT:-0.3}
      - RETRIEVAL_CANDIDATE_K=${RETRIEVAL_CANDIDATE_K:-20}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-5}
      # Optional features
      - ENABLE_RERANKER=${ENABLE_RERANKER:-false}
      - ENABLE_LLM_ENRICHMENT=${ENABLE_LLM_ENRICHMENT:-false}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: llm_search_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend

  mongodb:
    image: mongo:latest
    container_name: llm_search_mongodb
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
  chroma_data:

